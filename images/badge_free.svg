<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 32" width="76" height="32" fill="none">
  <defs>
    <!-- 主體 3D 立體綠寶石漸層 -->
    <linearGradient id="freeBadgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- 黃金立體邊框漸層 -->
    <linearGradient id="freeBadgeGoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- 頂部鏡面高光 -->
    <linearGradient id="freeBadgeGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- 立體投影 -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#047857" flood-opacity="0.35" />
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#022c22" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- 外層主體膠囊 (帶立體金邊) -->
  <g filter="url(#badgeShadow)">
    <rect x="2" y="2" width="72" height="26" rx="13" fill="url(#freeBadgeBg)" stroke="url(#freeBadgeGoldRim)" stroke-width="1.6" />
    <!-- 內圈細緻輔助線 -->
    <rect x="4" y="4" width="68" height="22" rx="11" stroke="#ffffff" stroke-opacity="0.25" stroke-width="0.8" fill="none" />
    <!-- 上半部高光反光弧面 -->
    <path d="M 3 13 C 3 7 7 3 15 3 L 61 3 C 69 3 73 7 73 13 C 50 16 26 16 3 13 Z" fill="url(#freeBadgeGloss)" />
  </g>

  <!-- 左側閃耀星芒圖示 (金光) -->
  <g transform="translate(13, 15)">
    <path d="M 0 -5 Q 0 0 5 0 Q 0 0 0 5 Q 0 0 -5 0 Q 0 0 0 -5 Z" fill="#fef08a" />
    <circle cx="0" cy="0" r="1.2" fill="#ffffff" />
  </g>

  <!-- 核心主文字：免費 -->
  <text x="38" y="16.5" fill="#ffffff" font-size="14" font-weight="950"
    font-family="'Geist', 'PingFang TC', 'Microsoft JhengHei', sans-serif"
    text-anchor="middle" dominant-baseline="central" letter-spacing="1.5" filter="url(#textGlow)">免費</text>

  <!-- 右側閃耀星芒圖示 (金光) -->
  <g transform="translate(63, 15)">
    <path d="M 0 -5 Q 0 0 5 0 Q 0 0 0 5 Q 0 0 -5 0 Q 0 0 0 -5 Z" fill="#fef08a" />
    <circle cx="0" cy="0" r="1.2" fill="#ffffff" />
  </g>
</svg>
