      padding: 6px;

      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card-wrapper:hover {
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.85),
        0 0 40px rgba(212, 175, 55, 0.2);
    }

    .card-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      user-select: auto;
      -webkit-touch-callout: default; /* 確保手機長按能跳出存圖/掃描選單 */
    }

    /* 長按提示條 */
    .tip-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      color: #c9b896;
      background: rgba(212, 175, 55, 0.08);
      border: 1px dashed rgba(212, 175, 55, 0.3);
      padding: 8px 14px;
      border-radius: 12px;
      width: 100%;
      text-align: center;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold-light);
      box-shadow: 0 0 8px var(--gold-light);
    }

    /* 行動按鈕組 (LINE 專用優化) */
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      margin-top: 4px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 18px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
      text-align: center;
    }

    .btn:active {
      transform: scale(0.97);
    }

    /* LINE 官方按鈕 */
    .btn-line {
      background: var(--line-green);
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(6, 199, 85, 0.35);
      grid-column: span 2;
      font-size: 15px;
      padding: 14px 20px;

    .btn-line:hover {

    /* 電話撥打按鈕 */

      color: #f5f2eb;
      border: 1px solid rgba(255, 255, 255, 0.12);

    .btn-call:hover {

      border-color: rgba(212, 175, 55, 0.4);
